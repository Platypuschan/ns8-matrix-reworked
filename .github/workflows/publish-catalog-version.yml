name: Publish tested catalog version

on:
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

permissions:
  actions: read
  contents: read

# Serialize all promotions, including reruns. Never cancel a partial publication.
concurrency:
  group: catalog-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.repository == 'Platypuschan/ns8-matrix-reworked' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check catalog version
        run: python3 .github/scripts/check-catalog-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tested-image-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: promotion-record
      - name: Promote the tested digest and reconcile its release
        shell: bash
        env:
          TESTED_REPOSITORY: ${{ github.repository }}
          TESTED_RUN_ID: ${{ github.event.workflow_run.id }}
          TESTED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y skopeo; }
          trap 'skopeo logout ghcr.io >/dev/null' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          python3 .github/scripts/promote-tested-image promote --record promotion-record/tested-image.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
