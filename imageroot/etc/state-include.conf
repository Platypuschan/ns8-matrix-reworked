#
# Matrix state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Only lines starting with "state/" or "volumes/" are considered by NS8.
#

# Settings and secrets; everything in synapse/ and web/ is rendered from it.
state/matrix.json
state/admin-created
# module-dump-state writes all PostgreSQL databases (Synapse and bridges) here.
state/postgresql.pg_dump
# Bridge configurations with their appservice tokens and encryption keys.
state/bridges
# Media store and the server signing key.
volumes/synapse-data
